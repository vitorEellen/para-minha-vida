<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Só para a Ellen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Quicksand:wght@500;600;700&display=swap">
<style>
:root{
  --blush:#fff0f5; --rose:#fbcfe8; --pink:#f472b6; --magenta:#db2777;
  --wine:#831843; --ink:#5b1237; --ink-soft:#8a3a64; --gold:#fbbf24; --gold-deep:#b45309;
  --glass:rgba(255,255,255,.62); --line:rgba(255,255,255,.9); --err:#be123c;
  --font-display:"Playfair Display", Georgia, serif;
  --font-body:"Quicksand", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  background-color:var(--blush);
  background-image:radial-gradient(120% 80% at 50% 0%,#fff8fb 0%,var(--blush) 42%,var(--rose) 100%);
  color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:380px;padding:38px 26px 30px;border-radius:28px;text-align:center;
  background:var(--glass);border:1.5px solid rgba(251,191,36,.7);
  box-shadow:0 0 34px rgba(251,191,36,.3),0 24px 60px -24px rgba(131,24,67,.3);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:flex;flex-direction:column;gap:16px}
.lock{font-size:2.4rem;line-height:1;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
h1{margin:0;font-family:var(--font-display);font-style:italic;font-weight:500;color:var(--wine);font-size:1.9rem;line-height:1.15}
.sub{margin:0;color:var(--ink-soft);font-weight:500}
form{display:flex;flex-direction:column;gap:12px;margin-top:4px;text-align:left}
label{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep)}
input{width:100%;font:600 1.05rem var(--font-body);color:var(--ink);padding:14px 16px;border-radius:16px;
  border:1px solid var(--line);background:rgba(255,255,255,.8);outline:none}
input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(244,114,182,.3)}
button{margin-top:6px;font:700 1.05rem var(--font-body);color:#fff;border:0;border-radius:999px;padding:15px 20px;cursor:pointer;
  background:linear-gradient(135deg,var(--pink),var(--magenta));box-shadow:0 12px 26px -10px rgba(219,39,119,.7)}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.msg{margin:0;min-height:1.4em;font-weight:700;color:var(--err);text-align:center}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.lock,.shake{animation:none}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="lock" aria-hidden="true">💌</div>
  <h1>Esta surpresa tem dona</h1>
  <p class="sub">Entre com o seu nome e a senha que eu te passei.</p>
  <form id="form" autocomplete="off">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" required>
    <button type="submit" id="btn">Entrar 💖</button>
    <p class="msg" id="msg" aria-live="polite"></p>
  </form>
</main>

const ITER = 250000;
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase().replace(/\s+/g, ' ');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(nome, senha) {
  const [salt, iv, data] = PAYLOAD.split('.').map(b64);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(nome) + '\n' + norm(senha)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plain);
}
const form = document.getElementById('form'), btn = document.getElementById('btn'), msg = document.getElementById('msg'), card = document.getElementById('card');
form.addEventListener('submit', async e => {
  e.preventDefault();
  btn.disabled = true; msg.textContent = '';
  try {
    const html = await abrir(form.nome.value, form.senha.value);
    document.open(); document.write(html); document.close();
  } catch (err) {
    btn.disabled = false;
    msg.textContent = 'Nome ou senha incorretos. Tente de novo.';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
});
